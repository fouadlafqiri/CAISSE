version: "3.8"

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HTTPS: ${APP_HTTPS:-0}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grocery
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
